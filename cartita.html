.contenedor {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 20px;
}

.encuesta {
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
}

button {
  padding: 12px 25px;
  margin: 10px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-size: 18px;
  transition: .3s;
}

button:hover {
  transform: scale(1.1);
}

button:first-child {
  background: #ff5f8a;
  color: white;
}

button:last-child {
  background: #888;
  color: white;
}
#triste , #prohibido {
  font-size: 120px;
  margin-top: 20px;
} 
#carta{
    display:flex;
    justify-content:center;
    margin-top:20px;
    display: none;
}
.oculto{
  display: none;
}
.carta{
    position:relative;
    width:500px;
    
}

.carta img{
    width:100%;
}

.mensaje{
    position:absolute;

    /* Ajusta estos valores hasta que quede sobre el papel */
    top:240px;
    left:50%;
    transform:translateX(-50%);

    width:70%;

    text-align:center;
    font-family:"Dancing Script", cursive;
    font-size:20px;
    line-height:1.4;
    color:#444;
}

.mensaje span{
    display:block;
    margin-top:8px;
    color:#d84f7d;
    font-size:20px;
    font-weight:bold;
}
  </style>
</head>
